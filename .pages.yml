media:
  input: public/images
  output: /images
  rename: safe
  extensions: [jpg, jpeg, png, webp, avif]

content:
  - name: builds
    label: Техника
    type: collection
    path: src/data/builds
    format: json
    filename: "{primary}.json"
    exclude: [.gitkeep]
    view:
      primary: title
      fields: [title, category, country, published]
    fields:
      - name: title
        label: Название
        type: string
        required: true
      - name: code
        label: Номер
        type: string
      - name: category
        label: Категория
        type: reference
        required: true
        options:
          collection: categories
          value: "{name}"
          label: "{label}"
          search: "code,label"
      - name: country
        label: Страна
        type: reference
        options:
          collection: countries
          value: "{name}"
          label: "{label}"
          search: "code,label"
      - name: description
        label: Описание
        type: text
      - name: images
        label: Фотографии
        type: image
        required: true
        options:
          multiple:
            min: 1
            max: 2
          extensions: [jpg, jpeg, png, webp, avif]
      - name: published
        label: Опубликовано
        type: boolean
        default: true
  - name: categories
    label: Категории
    type: collection
    path: src/data/categories
    format: json
    filename: "{code}.json"
    operations:
      rename: false
    view:
      primary: label
      fields: [code, order]
    fields:
      - name: code
        label: Код (латиницей)
        type: string
        required: true
        description: Не меняйте код после создания записи.
        pattern: "^[a-z0-9-]+$"
      - name: label
        label: Название
        type: string
        required: true
      - name: order
        label: Порядок
        type: number
  - name: countries
    label: Страны
    type: collection
    path: src/data/countries
    format: json
    filename: "{code}.json"
    operations:
      rename: false
    view:
      primary: label
      fields: [code]
    fields:
      - name: code
        label: Код (латиницей)
        type: string
        required: true
        description: Не меняйте код после создания записи.
        pattern: "^[a-z0-9-]+$"
      - name: label
        label: Название
        type: string
        required: true
  - name: site
    label: Сайт
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: brand
        label: Название
        type: string
      - name: heading
        label: Заголовок
        type: string
      - name: description
        label: Описание
        type: text
      - name: discord
        label: Ссылка Discord
        type: string
      - name: telegram
        label: Ссылка Telegram
        type: string
      - name: title
        label: Заголовок вкладки
        type: string
