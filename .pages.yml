media:
  input: public/images
  output: /images
  rename: safe
  extensions: [jpg, jpeg, png, webp, avif]

content:
  - name: builds
    label: Техника
    type: collection
    path: src/data/builds
    format: json
    filename: "{primary}.json"
    exclude: [.gitkeep]
    view:
      primary: title
      fields: [title, category, country, published]
    fields:
      - name: title
        label: Название
        type: string
        required: true
      - name: code
        label: Номер
        type: string
      - name: category
        label: Категория
        type: select
        required: true
        options:
          values:
            - name: aircraft
              label: Самолёты
            - name: helicopters
              label: Вертолёты
            - name: tanks
              label: Танки
            - name: armored
              label: Бронетехника
            - name: ships
              label: Корабли
            - name: vehicles
              label: Автомобили
            - name: trains
              label: Поезда
            - name: other
              label: Другое
      - name: country
        label: Страна
        type: string
      - name: description
        label: Описание
        type: text
      - name: images
        label: Фотографии
        type: image
        required: true
        options:
          multiple:
            min: 1
            max: 2
          extensions: [jpg, jpeg, png, webp, avif]
      - name: published
        label: Опубликовано
        type: boolean
        default: true
  - name: site
    label: Сайт
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: brand
        label: Название
        type: string
      - name: heading
        label: Заголовок
        type: string
      - name: description
        label: Описание
        type: text
      - name: discord
        label: Ссылка Discord
        type: string
      - name: telegram
        label: Ссылка Telegram
        type: string
      - name: title
        label: Заголовок вкладки
        type: string
