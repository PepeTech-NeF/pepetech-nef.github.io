media:
  input: public/images
  output: /images
  rename: safe
  extensions: [jpg, jpeg, png, webp, avif]

content:
  - name: builds
    label: Техника
    type: collection
    path: src/data/builds
    format: json
    filename: "{primary}.json"
    exclude: [.gitkeep]
    view:
      primary: title
      fields: [title, category, country, published]
    fields:
      - name: title
        label: Название
        type: string
        required: true
      - name: category
        label: Категория
        type: reference
        required: true
        options:
          collection: categories
          value: "{fields.code}"
          label: "{fields.label}"
          search: "fields.code,fields.label"
      - name: country
        label: Страна
        type: reference
        options:
          collection: countries
          value: "{fields.code}"
          label: "{fields.label}"
          search: "fields.code,fields.label"
      - name: description
        label: Описание
        type: text
      - name: images
        label: Фотографии
        type: image
        required: true
        options:
          multiple:
            min: 1
            max: 2
          extensions: [jpg, jpeg, png, webp, avif]
      - name: published
        label: Опубликовано
        type: boolean
        default: true
  - name: dictionaries
    label: Справочники
    type: group
    items:
      - name: categories
        label: Категории
        type: collection
        path: src/data/categories
        format: json
        filename: "{code}.json"
        operations:
          rename: false
        view:
          primary: label
          fields: [code, order]
        fields:
          - name: code
            label: Код (латиницей)
            type: string
            required: true
            description: Не меняйте код после создания записи.
            pattern: "^[a-z0-9-]+$"
          - name: label
            label: Название
            type: string
            required: true
          - name: order
            label: Порядок
            type: number
      - name: countries
        label: Страны
        type: collection
        path: src/data/countries
        format: json
        filename: "{code}.json"
        operations:
          rename: false
        view:
          primary: label
          fields: [code]
        fields:
          - name: code
            label: Код (латиницей)
            type: string
            required: true
            description: Не меняйте код после создания записи.
            pattern: "^[a-z0-9-]+$"
          - name: label
            label: Название
            type: string
            required: true
  - name: site
    label: Сайт
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: brand
        label: Название проекта
        type: string
      - name: heading
        label: Заголовок портфолио
        type: string
      - name: description
        label: Описание портфолио
        type: text
      - name: discord
        label: Личный Discord
        type: string
        description: Ник (например, nef1c) или ссылка вида https://discord.com/users/123456789
      - name: telegram
        label: Личный Telegram
        type: string
        description: Ник с @ (например, @username) или ссылка https://t.me/username
      - name: discord_server
        label: Discord-сервер
        type: string
        description: Ссылка-приглашение https://discord.gg/... или https://discord.com/invite/...
      - name: telegram_channel
        label: Telegram-канал
        type: string
        description: Ник канала с @ или ссылка https://t.me/...
      - name: title
        label: Заголовок вкладки
        type: string
      - name: publishing_paused
        label: Приостановить автопубликацию
        type: boolean
        default: false
        description: Изменения сохраняются в GitHub, но сайт не обновляется автоматически. Для публикации используйте кнопку «Опубликовать сейчас» или выключите паузу.

actions:
  - name: publish-now
    label: Опубликовать сейчас
    workflow: deploy.yml
    ref: current
    cancelable: false
    confirm:
      title: Опубликовать изменения?
      message: Все сохранённые изменения появятся на сайте. Режим автопубликации не изменится.
      button: Опубликовать
