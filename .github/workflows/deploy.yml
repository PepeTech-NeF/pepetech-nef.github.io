name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS action payload
        required: false
        type: string

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check publication mode
        id: mode
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif python3 -c 'import json,sys; sys.exit(0 if json.load(open("src/data/site.json")).get("publishing_paused") is True else 1)'; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Automatic publishing is paused."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: github.event_name == 'pull_request' || steps.mode.outputs.publish == 'true'
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
        if: github.event_name == 'pull_request' || steps.mode.outputs.publish == 'true'
      - run: npm test
        if: github.event_name == 'pull_request' || steps.mode.outputs.publish == 'true'
      - run: npm run build
        if: github.event_name == 'pull_request' || steps.mode.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request' && steps.mode.outputs.publish == 'true'
        with:
          path: dist/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
