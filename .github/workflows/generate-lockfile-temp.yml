name: Generate npm lockfile (temporary)

on:
  push:
    branches: [chore/security-hardening]

permissions:
  contents: read

jobs:
  generate-lockfile:
    if: github.repository == 'PepeTech-NeF/pepetech-nef.github.io'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate package-lock.json without running dependency scripts
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "Lockfile already committed."
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git add package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: lock npm dependencies'
          git push origin HEAD:refs/heads/chore/security-hardening
