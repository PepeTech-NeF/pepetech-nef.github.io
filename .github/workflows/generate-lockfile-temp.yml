name: Sync npm lockfile (temporary)

on:
  push:
    branches: [chore/security-hardening]

permissions:
  contents: read

jobs:
  sync-lock:
    if: github.repository == 'PepeTech-NeF/pepetech-nef.github.io'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Update lockfile without running dependency scripts
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already matches."
            exit 0
          fi
          git add package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: update locked dependencies'
          git push origin HEAD:refs/heads/chore/security-hardening
